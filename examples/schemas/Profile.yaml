name:
  required: true
  minLength: 3

# Referenced enum.
status:
  $ref: 'Status'
  default: 'PENDING'

# Nested enum.
gender:
  enum:
    - 'Male'
    - 'Female'
    - 'Other'
  default: 'Other'

# Nested object.
contactDetails:
  required: true

  properties:
    email:
      type:     'string'
      format:   'email'
      required: true

    secondaryEmail:
      type:   'string'
      format: 'email'

    mobileNumber:
      type:    string
      pattern: '^[0-9]{1,20}$'
      default: '380504112171'

# Array of nested objects.
locations:
  items:
    properties:
      name:
        required: true

      address:
        properties:
          country:
            required: true
            default:  'Ukraine'

          city:
            required: true

          addressLine1:
            required: true

          addressLine2: {}

          zip:
            required: true

          type:
            enum:
              - 'Primary'
              - 'Secondary'
            default: 'Secondary'

# Array of strings.
tags:
  type: array

# Array of referenced objects.
favoriteItems:
  items:
    $ref: 'FavoriteItem'

# Referenced object.
preferences:
  $ref: 'Preferences'

# Nested object without properties.
hash:
  type: object
